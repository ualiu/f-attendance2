  <g
    fill="none"
    stroke="#4ade80"
    stroke-width="2.75"
    stroke-linecap="round"
  >
    <circle cx="14.75" cy="14" r="5.25" />
    <path d="M20 8.75v11.4a4.6 4.6 0 0 1-7.7 3.4" />
  </g>
</svg>
