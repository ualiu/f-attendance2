<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- godspec.ai mark: a lowercase "g" drawn as strokes rather than as text,
       so it renders identically everywhere instead of depending on a font
       being installed. Colours match the site background and green accent.
       Note: XML comments may not contain a double hyphen, so CSS custom
       property names are not written out here. -->
